<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto-Mark</title>
    <link rel="stylesheet" href="style.css"></link>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="home">
      <h1 class="text-6xl">Auto-Mark</h1>
    </div>
    <div class="form">
      <section>
        <label for="name">Name:</label>
      <input id="name" name="name" required type="text" placeholder="John Alex">
      </section>
      <section>
        <label for="date">Date:</label>
      <input id="date" name="date" required type="date">
      </section>
      <section>
        <label for="c-name">Company Name:</label>
      <input id="c-name" name="c-name" required type="text" placeholder="Enter Company Name">
      </section>
      <section>
        <label for="place">Place:</label>
      <textarea id="place" name="place" required type="text" placeholder="Enter full Address"></textarea>
      </section>
      <div class="buttons">
        <button class="bg-red-200 text-black px-5 py-2 rounded-lg hover:bg-red-300 transition">
    Reset</button>
        <button class="bg-green-200 text-black px-5 py-2 rounded-lg hover:bg-green-300 transition">Submin</button>
      </div>
    </div>

  </body>
</html>
